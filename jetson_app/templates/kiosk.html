<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>RoboFriend — Kiosk</title>
    <link rel="stylesheet" href="../static/styles/style.css">
    <script src="../static/scripts/script.js"></script>
</head>
<body>
    <main>
        <section id="screen-pairing" class="screen">
            <h2>Zeskanuj, aby połączyć telefon</h2>
            <img class="qr-code" src="data:image/png;base64,{{ qr_code_base64 }}" alt="Kod QR do połączenia">
            <p class="site-url">{{ site_url }}</p>
            <p class="status {{ 'connected' if connected else 'not-connected' }}">
                {{ "Połączono" if connected else "Niepołączono" }}
            </p>
        </section>
    </main>
</body>
</html>
